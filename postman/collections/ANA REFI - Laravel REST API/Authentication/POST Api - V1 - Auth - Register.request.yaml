$kind: http-request
name: POST Api / V1 / Auth / Register
description: "Registers a new traveler or host account. JSON body: first_name, last_name, email, phone, password, password_confirmation, and account_type (traveler|host); host registration also requires a 14-digit national_id and may include id_front/id_back storage paths. Returns 201 with user, profile, roles, and a Bearer token. Rate limit: 10 requests/minute."
url: "{{base_url}}/api/v1/auth/register"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: '{"first_name":"Postman","last_name":"API Test","email":"{{test_email}}","phone":"{{test_phone}}","password":"TestPass123!","password_confirmation":"TestPass123!","account_type":"traveler"}'
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      const stamp = Date.now();
      pm.collectionVariables.set('test_email', 'postman-' + stamp + '@example.invalid');
      pm.collectionVariables.set('test_phone', '+2011' + String(stamp).slice(-8));
      pm.collectionVariables.set('token', '');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('No unexpected server error', function () { pm.expect(pm.response.code).to.be.below(500); });
      const url = pm.request.url.toString();
      if (url.endsWith('/auth/register')) {
        pm.test('Registration creates a traveler and returns a bearer token', function () {
          pm.response.to.have.status(201);
          const body = pm.response.json();
          pm.expect(body).to.have.property('token').that.is.a('string').and.not.empty;
          pm.expect(body).to.have.property('data');
          pm.collectionVariables.set('token', body.token);
          pm.environment.set('token', body.token);
        });
      }
      if (url.endsWith('/auth/login')) {
        pm.test('Login returns a bearer token', function () {
          pm.response.to.have.status(200);
          const body = pm.response.json();
          pm.expect(body).to.have.property('token').that.is.a('string').and.not.empty;
          pm.collectionVariables.set('token', body.token);
          pm.environment.set('token', body.token);
        });
      }
      if (url.includes('/auth/google/callback')) {
        pm.test('Invalid OAuth callback is rejected', function () { pm.response.to.have.status(422); });
      }
      if (url.endsWith('/auth/google/redirect')) {
        pm.test('Google OAuth is explicitly unconfigured (503)', function () { pm.response.to.have.status(503); });
      }
      if (url.includes('/auth/user')) {
        pm.test('Authenticated user endpoint returns user data', function () {
          pm.response.to.have.status(200);
          pm.expect(pm.response.json()).to.have.nested.property('data.user.id');
        });
      }
      if (url.endsWith('/auth/logout')) {
        pm.test('Logout revokes the session', function () { pm.response.to.have.status(204); });
      }
    language: text/javascript
order: 1000
